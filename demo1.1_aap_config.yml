---
- name: "Demo 1.1 — Configure AAP Controller for iSeries Demo Suite"
  hosts: localhost
  gather_facts: false

  vars:
    controller_hostname: https://xerxes.thenorvilles.com
    controller_username: cnorville
    controller_password: "{{ controller_token }}"
    controller_validate_certs: false

    controller_credentials:
      - name: "pub400-ssh"
        description: "SSH key credential for pub400.com iSeries"
        organization: Default
        credential_type: Machine
        inputs:
          username: CNORVILLE
          ssh_key_data: "{{ lookup('file', 'id_rsa_apd') }}"

      - name: "ansible-iseries-repo"
        description: "SCM credential for ansible-iseries project"
        organization: Default
        credential_type: Source Control

    controller_inventories:
      - name: "IBM iSeries — pub400"
        description: "Public IBM i system at pub400.com"
        organization: Default

    controller_hosts:
      - name: pub400.com
        inventory: "IBM iSeries — pub400"
        variables:
          ansible_user: CNORVILLE
          ansible_port: 2222
          ansible_python_interpreter: /QOpenSys/pkgs/bin/python3.6

    controller_projects:
      - name: "ansible-iseries"
        description: "IBM iSeries demo suite playbooks"
        organization: Default
        scm_type: git
        scm_url: "https://github.com/cnorville90/ansible-iseries.git"
        scm_branch: main
        scm_clean: true
        scm_update_on_launch: true

    controller_templates:
      - name: "Demo 1 — IBM i System Discovery"
        description: "Gather and display IBM i system facts from pub400.com"
        organization: Default
        project: "ansible-iseries"
        playbook: demo1_ibmi_facts.yml
        inventory: "IBM iSeries — pub400"
        credentials:
          - "pub400-ssh"
        ask_variables_on_launch: false

  roles:
    - infra.aap_configuration.controller_credentials
    - infra.aap_configuration.controller_inventories
    - infra.aap_configuration.controller_hosts
    - infra.aap_configuration.controller_projects
    - infra.aap_configuration.controller_job_templates

- name: "Launch Demo 1 job template"
  hosts: localhost
  gather_facts: false

  vars:
    controller_hostname: https://xerxes.thenorvilles.com
    controller_username: cnorville
    controller_password: "{{ controller_token }}"
    controller_validate_certs: false

    controller_launch_jobs:
      - name: "Demo 1 — IBM i System Discovery"
        wait: true

  roles:
    - infra.aap_configuration.controller_job_launch
