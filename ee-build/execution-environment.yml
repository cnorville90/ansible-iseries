---
version: 3

dependencies:
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-supported-rhel9:latest

additional_build_files:
  - src: ansible.cfg
    dest: src

additional_build_steps:
  prepend_galaxy:
    - COPY _build/src/ansible.cfg /etc/ansible/ansible.cfg
  prepend_builder:
    - RUN sed -i '/systemd-python/d' /tmp/src/requirements.txt || true
