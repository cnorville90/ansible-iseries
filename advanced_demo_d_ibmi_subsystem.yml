---
- name: "Advanced Demo D — IBM i Subsystem & Job Queue Control"
  hosts: iseries
  gather_facts: false

  vars:
    target_subsystem: "QBATCH"
    job_queue_lib: "QGPL"
    job_queue_name: "QBATCH"

  tasks:

    - name: Check current subsystem status
      ibm.power_ibmi.ibmi_display_subsystem:
        subsystem: "{{ target_subsystem }}"
      register: subsystem_status

    - name: Display current subsystem state
      ansible.builtin.debug:
        msg:
          - "=============================="
          - " Subsystem Status — Before"
          - "=============================="
          - "Subsystem : {{ target_subsystem }}"
          - "Output    : {{ subsystem_status.subsystems | join(' | ') | truncate(120) }}"
          - "=============================="

    - name: Hold job queue to pause new job submission
      ibm.power_ibmi.ibmi_cl_command:
        cmd: "HLDJOBQ JOBQ({{ job_queue_lib }}/{{ job_queue_name }})"
      register: hold_result

    - name: Display hold result
      ansible.builtin.debug:
        msg:
          - "=============================="
          - " Job Queue Hold"
          - "=============================="
          - "Job Queue : {{ job_queue_lib }}/{{ job_queue_name }}"
          - "RC        : {{ hold_result.rc }}"
          - "Status    : {{ 'HELD — no new jobs will be dispatched' if hold_result.rc == 0 else 'FAILED' }}"
          - "=============================="

    - name: Verify job queue is held via SQL
      ibm.power_ibmi.ibmi_sql_query:
        sql: >
          SELECT JOB_QUEUE_NAME, JOB_QUEUE_LIBRARY, JOB_QUEUE_STATUS,
                 NUMBER_OF_JOBS
          FROM QSYS2.JOB_QUEUE_INFO
          WHERE JOB_QUEUE_NAME = '{{ job_queue_name }}'
      register: jq_status

    - name: Display job queue status
      ansible.builtin.debug:
        msg:
          - "=============================="
          - " Job Queue Verification"
          - "=============================="
          - "Queue   : {{ jq_status.row[0].JOB_QUEUE_NAME }}"
          - "Status  : {{ jq_status.row[0].JOB_QUEUE_STATUS }}"
          - "Jobs    : {{ jq_status.row[0].NUMBER_OF_JOBS }}"
          - "=============================="
      when: jq_status.row | length > 0

    - name: Release job queue to resume normal operations
      ibm.power_ibmi.ibmi_cl_command:
        cmd: "RLSJOBQ JOBQ({{ job_queue_lib }}/{{ job_queue_name }})"
      register: release_result

    - name: Display release result
      ansible.builtin.debug:
        msg:
          - "=============================="
          - " Job Queue Release"
          - "=============================="
          - "Job Queue : {{ job_queue_lib }}/{{ job_queue_name }}"
          - "RC        : {{ release_result.rc }}"
          - "Status    : {{ 'RELEASED — job dispatch resumed' if release_result.rc == 0 else 'FAILED' }}"
          - "=============================="
