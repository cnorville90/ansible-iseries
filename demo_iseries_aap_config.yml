---
- name: "Configure AAP Controller for iSeries Demo Suite"
  hosts: localhost
  gather_facts: false

  vars:
    aap_hostname: https://xerxes.thenorvilles.com
    aap_username: cnorville
    aap_token: "{{ controller_token }}"
    aap_validate_certs: false

    controller_execution_environments:
      - name: "ee-iseries"
        image: quay.io/cnorvill/ee-iseries:latest
        pull: missing

    controller_credentials:
      - name: "pub400-ssh"
        description: "SSH key credential for pub400.com iSeries"
        organization: Default
        credential_type: Machine
        inputs:
          username: CNORVILLE
          ssh_key_data: "{{ lookup('file', 'id_rsa_apd') }}"

      - name: "ansible-iseries-repo"
        description: "SCM credential for ansible-iseries project"
        organization: Default
        credential_type: Source Control

    controller_inventories:
      - name: "IBM iSeries — pub400"
        description: "Public IBM i system at pub400.com"
        organization: Default

    controller_hosts:
      - name: pub400.com
        inventory: "IBM iSeries — pub400"
        variables:
          ansible_user: CNORVILLE
          ansible_port: 2222
          ansible_python_interpreter: /QOpenSys/pkgs/bin/python3.6

    controller_groups:
      - name: iseries
        inventory: "IBM iSeries — pub400"
        hosts:
          - pub400.com

    controller_projects:
      - name: "ansible-iseries"
        description: "IBM iSeries demo suite playbooks"
        organization: Default
        scm_type: git
        scm_url: "https://github.com/cnorville90/ansible-iseries.git"
        scm_branch: main
        scm_clean: true
        scm_update_on_launch: true
        wait: true

    controller_templates:
      - name: "Demo 1 — IBM i System Discovery"
        description: "Gather and display IBM i system facts from pub400.com"
        organization: Default
        project: "ansible-iseries"
        playbook: demo1_ibmi_facts.yml
        inventory: "IBM iSeries — pub400"
        execution_environment: "ee-iseries"
        credentials:
          - "pub400-ssh"
        ask_variables_on_launch: false

      - name: "Demo 2 — IBM i System Value Audit"
        description: "Read and report key IBM i system values for compliance"
        organization: Default
        project: "ansible-iseries"
        playbook: demo2_ibmi_sysval.yml
        inventory: "IBM iSeries — pub400"
        execution_environment: "ee-iseries"
        credentials:
          - "pub400-ssh"
        ask_variables_on_launch: false

      - name: "Demo 3 — IBM i SQL Query Reporting"
        description: "Query DB2 for i catalog tables for active jobs, users, and libraries"
        organization: Default
        project: "ansible-iseries"
        playbook: demo3_ibmi_sql_query.yml
        inventory: "IBM iSeries — pub400"
        execution_environment: "ee-iseries"
        credentials:
          - "pub400-ssh"
        ask_variables_on_launch: false

      - name: "Demo 4 — IBM i Job & Subsystem Operations"
        description: "Query active jobs and display subsystem status"
        organization: Default
        project: "ansible-iseries"
        playbook: demo4_ibmi_jobs.yml
        inventory: "IBM iSeries — pub400"
        execution_environment: "ee-iseries"
        credentials:
          - "pub400-ssh"
        ask_variables_on_launch: false

      - name: "Demo 5 — IBM i PTF Compliance"
        description: "Check PTF group levels against IBM PSP server"
        organization: Default
        project: "ansible-iseries"
        playbook: demo5_ibmi_ptf.yml
        inventory: "IBM iSeries — pub400"
        execution_environment: "ee-iseries"
        credentials:
          - "pub400-ssh"
        ask_variables_on_launch: false

  roles:
    - infra.aap_configuration.controller_execution_environments
    - infra.aap_configuration.controller_credentials
    - infra.aap_configuration.controller_inventories
    - infra.aap_configuration.controller_hosts
    - infra.aap_configuration.controller_host_groups
    - infra.aap_configuration.controller_projects
    - infra.aap_configuration.controller_project_update
    - infra.aap_configuration.controller_job_templates
